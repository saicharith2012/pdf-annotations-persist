<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<link rel="stylesheet" href="../vendor/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">

<div id="notices"></div>

<header id="toolbar">
  <div class="group">
    <button id="prevPage" class="icon" title="Previous page (P)" aria-label="Previous page">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 6 8l5 5"/></svg>
    </button>
    <input id="pageNumber" type="number" min="1" value="1" aria-label="Page number">
    <span id="pageCount" class="muted">/ 0</span>
    <button id="nextPage" class="icon" title="Next page (N)" aria-label="Next page">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <div class="group">
    <button id="zoomOut" class="icon" title="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
    </button>
    <select id="zoomLevel" aria-label="Zoom level">
      <option value="auto">Automatic</option>
      <option value="page-fit">Page fit</option>
      <option value="page-width">Page width</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="4">400%</option>
    </select>
    <button id="zoomIn" class="icon" title="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <div class="group" id="tools" role="radiogroup" aria-label="Annotation tools">
    <button class="icon tool active" data-tool="select" title="Select (Esc)" aria-label="Select">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l9 5.5-4 1-1.7 3.9z"/></svg>
    </button>
    <button class="icon tool" data-tool="highlight" title="Highlight (H)" aria-label="Highlight">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 9.5 9.5 4l2.5 2.5L6.5 12H4z"/><path d="M2 14.5h12"/></svg>
    </button>
    <button class="icon tool" data-tool="draw" title="Draw (D)" aria-label="Draw">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14c1-4 3-6 5.5-6M12.5 2.5 14 4 7 11l-2 .5.5-2z"/></svg>
    </button>
    <button class="icon tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx="1"/></svg>
    </button>
    <button class="icon tool" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse">
      <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.5" ry="4"/></svg>
    </button>
    <button class="icon tool" data-tool="line" title="Line (L)" aria-label="Line">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3"/></svg>
    </button>
    <button class="icon tool" data-tool="arrow" title="Arrow (A)" aria-label="Arrow">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M13 3H8.5M13 3v4.5"/></svg>
    </button>
    <button class="icon tool" data-tool="text" title="Text box (T)" aria-label="Text box">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4V3h10v1M8 3v10M6 13h4"/></svg>
    </button>
    <button class="icon tool" data-tool="erase" title="Eraser (E) — click a mark to remove it" aria-label="Eraser">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 13H3.8l-1.3-1.3a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4L7 13z"/><path d="M6 6.5 10.5 11M13.5 13H7"/></svg>
    </button>
  </div>

  <div class="group" id="toolParams" hidden>
    <div id="swatches" role="radiogroup" aria-label="Colour"></div>
    <label id="thicknessWrap" class="muted" hidden>
      <span>Size</span>
      <input id="thickness" type="range" min="1" max="20" value="3" aria-label="Thickness">
    </label>
  </div>

  <div class="group">
    <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h6.5a3 3 0 1 1 0 6H6M3 8l3-3M3 8l3 3"/></svg>
    </button>
    <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H6.5a3 3 0 1 0 0 6H10M13 8l-3-3M13 8l-3 3"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <div class="group">
    <button id="findToggle" class="icon" title="Find (Ctrl+F)" aria-label="Find">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4"/><path d="M10 10l4 4"/></svg>
    </button>
    <button id="saveChip" class="chip" title="Where your changes are saved">
      <span id="saveDot" class="dot"></span><span id="saveText">Loading…</span>
    </button>
    <button id="menuToggle" class="icon" title="More" aria-label="More" aria-expanded="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="13" cy="8" r="1.2"/></svg>
    </button>
  </div>

  <div id="menu" hidden role="menu">
    <button id="syncFile" role="menuitem">Keep a file on disk in sync…</button>
    <button id="unsyncFile" role="menuitem" hidden>Stop syncing this file</button>
    <button id="saveCopy" role="menuitem">Save a copy…</button>
    <button id="showOriginal" role="menuitem">Show the original (discard nothing)</button>
    <button id="openNative" role="menuitem">Open in Brave's built-in viewer</button>
    <div class="menu-sep"></div>
    <button id="openOptions" role="menuitem">Extension settings…</button>
  </div>
</header>

<div id="findbar" hidden>
  <input id="findInput" type="search" placeholder="Find in document" aria-label="Find in document">
  <button id="findPrev" class="icon" aria-label="Previous match">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 10 8 6l-3 4"/></svg>
  </button>
  <button id="findNext" class="icon" aria-label="Next match">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6l3 4 3-4"/></svg>
  </button>
  <span id="findStatus" class="muted"></span>
  <button id="findClose" class="icon" aria-label="Close find">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
</div>

<div id="shapeOverlay" hidden><svg id="shapePreview" aria-hidden="true"></svg></div>

<div id="viewerContainer" tabindex="0">
  <div id="viewer" class="pdfViewer"></div>
</div>

<div id="loading">
  <div class="spinner" aria-hidden="true"></div>
  <p id="loadingText">Opening PDF…</p>
</div>

<script type="module" src="viewer.js"></script>
